name: Train Heart Disease Model CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Set up job
        run: echo "Starting CI pipeline for Heart Disease Model"

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          which python

      - name: Install dependencies
        run: |
          pip install mlflow scikit-learn pandas numpy

      - name: Run mlflow project
        run: |
          cd MLProject && mlflow run . --experiment-name Heart_Disease_CI --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          ls MLProject/mlruns/1/ 2>/dev/null || ls mlruns/1/ 2>/dev/null | grep -v models | head -1

